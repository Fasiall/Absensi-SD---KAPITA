<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563EB">
  <title>Offline - Absensi QR Siswa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1E293B;
      background: #F4F7FB;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    .badge {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 18px;
      color: #2563EB;
      background: #EFF6FF;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 22px; color: #64748B; line-height: 1.6; }
    button {
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #2563EB;
      cursor: pointer;
    }
    button:hover { background: #1D4ED8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <h1>Tidak ada koneksi</h1>
    <p>
      Halaman ini membutuhkan internet. Absensi yang sudah tersimpan di perangkat
      akan dikirim otomatis saat koneksi kembali.
    </p>
    <button type="button" onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
