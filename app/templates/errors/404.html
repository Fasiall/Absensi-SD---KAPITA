{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Halaman Tidak Ditemukan{% endblock %}

{% block content %}
<div class="error-page card">
  <span class="error-code">404</span>
  <div class="empty-icon">{{ icon('search', 30) }}</div>
  <h1>Halaman tidak ditemukan</h1>
  <p>Halaman yang Anda cari mungkin sudah dipindahkan atau alamatnya salah.</p>
  <a class="btn btn-primary" href="{{ url_for('auth.login') if not current_user.is_authenticated else (url_for('admin.dashboard') if current_user.role == 'admin' else url_for('guru.scan')) }}">
    Kembali ke Beranda
  </a>
</div>
{% endblock %}
